name: Supply chain scan

on:
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: License inventory
        run: npx --yes license-checker-rseidelsohn --json --out licenses.json

      - name: npm audit
        run: npm audit --json > npm-audit.json

      - name: Upload scan JSON
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-json
          path: |
            sbom.cdx.json
            licenses.json
            npm-audit.json
          if-no-files-found: error
